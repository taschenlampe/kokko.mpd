# cava config for the kokko.mpd panel and hover-card visualiser.
# Raw ASCII bars on stdout, one frame per line, values 0..1000.
[general]
bars = 12
framerate = 30

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
